apiVersion: apps/v1 # change version API
kind: ReplicaSet # change resource name
metadata:
  name: hello-rs
spec:
  replicas: 2
  selector:
    matchLabels: # change here
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:          
      - name: nginx-container   
        image: nginx:latest     
        ports:
        - containerPort: 80     
        livenessProbe:          
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
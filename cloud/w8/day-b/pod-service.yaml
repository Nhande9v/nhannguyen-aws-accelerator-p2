apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  index.html: |
    "<h1>Chao Nhan! Day-B K8s Lab da hoat dong thanh cong!</h1>"
---
apiVersion: v1
kind: Pod
metadata:
  name: my-nginx-pod
  labels:
    app: web-app
spec: 
  containers:
  - name: nginx-container
    image: nginx:latest
    ports:
    - containerPort: 80
    # Liveness và Readiness probe kiểm tra sức khỏe pod
    livenessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
    volumeMounts: 
    - name: web-content
      mountPath: /usr/share/nginx/html
  volumes:
  - name: web-content
    configMap:
      name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: NodePort
  selector:
    app: web-app
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: backend-app
  namespace: argocd

spec: 
  project: default
  source: 
    repoURL: https://github.com/Nhande9v/nhannguyen-aws-accelerator-p2.git
    targetRevision: main
    path: cloud/w9/day-a/k8s-manifests/backend

  destination:
    server: https://kubernetes.default.svc
    namespace: apps

  syncPolicy: 
    automated: 
      prune: true
      selfHeal: true




apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: backend-app
  namespace: argocd

spec: 
  project: default
  source: 
    repo: https://github.com/YOUR_USERNAME/day-1.git
    targetRevision: HEAD
    path: k8s-manifest/backend

  destination:
    server: https://kubernetes.default.svc
    namespace: apps

  syncPolicy: 
    automated: 
      prune: true
      selfHeal: true
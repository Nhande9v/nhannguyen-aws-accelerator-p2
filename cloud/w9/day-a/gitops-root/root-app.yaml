apiVersion:  argoproj.io/v1alpha1
kind: Application

metadata:
  name: root-app
  namespace: argocd

spec:
  project: default
  source:
    repo: https://github.com/YOUR_USERNAME/day-1.git
    targetRevision: HEAD
    path: gitops-root/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy: 
    automated: 
      prune: true
      selfHeal: true
apiVersion: apps/v1
kind: doiquaidi

metadata:
  name: backend-deployment
  namespace: apps

  annotations:
    argocd.argoproj.io/sync-wave: "10"

spec:

  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:

    metadata:
      labels:
        app: backend

    spec:

      containers:

      - name: backend

        image: nginx:latest

        ports:
          - containerPort: 80
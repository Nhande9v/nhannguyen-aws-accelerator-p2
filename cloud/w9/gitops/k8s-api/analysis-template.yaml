apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: api-success-rate-api
  namespace: demo
spec:
  metrics:
  - name: success-rate
    interval: 10s
    failureLimit: 1
    successCondition: result[0] >= 0.95
    provider:
      prometheus:
        address: http://prometheus-server.monitoring.svc.cluster.local:9090
        query: |
          (sum(rate(flask_http_request_total{status=~"2.."}[1m])) or vector(1))
          /
          (sum(rate(flask_http_request_total[1m])) or vector(1))

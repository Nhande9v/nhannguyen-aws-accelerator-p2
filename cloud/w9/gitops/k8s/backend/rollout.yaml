apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend
  namespace: demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: node:20-alpine
        command: ["node", "-e"]
        args:
          - |
            const http = require('http');
            let requestCount = 0;
            let errorCount = 0;
            let injectError = false;

            http.createServer((req, res) => {
              if (req.url === '/metrics') {
                res.writeHead(200, {'Content-Type': 'text/plain; version=0.0.4'});
                res.write(`# HELP http_requests_total Total number of HTTP requests\n`);
                res.write(`# TYPE http_requests_total counter\n`);
                res.write(`http_requests_total{app="backend",status="200"} ${requestCount - errorCount}\n`);
                res.write(`http_requests_total{app="backend",status="500"} ${errorCount}\n`);
                res.end();
                return;
              }
              
              if (req.url === '/inject-error') {
                injectError = !injectError;
                res.writeHead(200, {'Content-Type': 'application/json'});
                res.end(JSON.stringify({ message: `Error injection toggled. Current state: ${injectError}` }));
                return;
              }

              if (req.url === '/health') {
                res.writeHead(200, {'Content-Type': 'text/plain'});
                res.end('OK');
                return;
              }

              requestCount++;
              if (injectError) {
                errorCount++;
                res.writeHead(500, {'Content-Type': 'application/json'});
                res.end(JSON.stringify({ error: "Internal Server Error", pod: process.env.HOSTNAME }));
              } else {
                res.writeHead(200, {'Content-Type': 'application/json'});
                res.end(JSON.stringify({ message: "Hello from Node.js Backend v2!", pod: process.env.HOSTNAME }));
              }
            }).listen(8080);
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
  strategy:
    canary:
      analysis:
        templates:
        - templateName: api-success-rate # Kết nối tới file AnalysisTemplate
      steps:
      - setWeight: 20
      - pause: {duration: 1m} # Chạy 20% traffic trong 1 phút để kiểm tra
      - setWeight: 50
      - pause: {duration: 1m} # Chạy 50% traffic trong 1 phút
      - setWeight: 100

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: demo
spec:
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
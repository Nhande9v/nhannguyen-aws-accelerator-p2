apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: node:20-alpine
        command: ["node", "-e"]
        args:
          - |
            const http = require('http');
            http.createServer((req, res) => {
              // Gọi tới backend thông qua Service nội bộ của K8s
              http.get('http://backend-service:8080', (beRes) => {
                let data = '';
                beRes.on('data', (chunk) => data += chunk);
                beRes.on('end', () => {
                  res.writeHead(200, {'Content-Type': 'application/json'});
                  res.end(data); // Trả kết quả từ Backend về trình duyệt
                });
              }).on('error', (err) => {
                res.end('Backend not reachable');
              });
            }).listen(3000);
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: demo
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer
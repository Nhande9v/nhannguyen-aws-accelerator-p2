apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-app
spec:
  replicas: 4
  strategy:
    canary:
      stableService: demo-app-stable
      canaryService: demo-app-canary
      trafficRouting:
        managedRoutes:
        - name: primary
      steps:
      - setWeight: 20
      - pause: { duration: 1m }
      # Tích hợp Analysis ngầm khi ở mức 20% traffic
      - analysis:
          templates:
          - templateName: error-rate-analysis
          - templateName: latency-analysis
          - templateName: burn-rate-analysis
      - setWeight: 50
      - pause: { duration: 2m }
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
      - name: web
        image: ghcr.io/argoproj/rollouts-demo:blue # V1 là Blue, V2 sẽ đổi thành Green/Yellow để test
        ports:
        - containerPort: 8080
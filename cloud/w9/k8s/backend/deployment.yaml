apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: node:20-alpine
        command: ["node", "-e"]
        args:
          - |
            const http = require('http');
            http.createServer((req, res) => {
              res.writeHead(200, {'Content-Type': 'application/json'});
              res.end(JSON.stringify({ message: "Hello from Node.js Backend!", pod: process.env.HOSTNAME }));
            }).listen(8080);
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: demo
spec:
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 8080